[package]
name = "sidra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
discord-rich-presence = "1.1.0"
eframe = "0.33"
egui = "0.33"
egui-phosphor = "0.11"
egui_extras = { version = "0.33", default-features = false, features = ["image"] }
ehttp = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
notify-rust = "4.19.0"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sidra-core = { version = "0.1.0", path = "../sidra-core" }
tray-icon = "0.26.1"
unicode-bidi = "0.3"
url = "2.5"
wry = "=0.57.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
