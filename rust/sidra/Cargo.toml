[package]
name = "sidra"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
eframe = "0.33"
egui = "0.33"
egui-phosphor = "0.11"
egui_extras = { version = "0.33", default-features = false, features = ["image"] }
ehttp = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sidra-core = { version = "0.1.0", path = "../sidra-core" }
unicode-bidi = "0.3"
url = "2.5"
wry = "=0.57.2"
