[package]
name = "sidra-core"
version = "0.1.0"
description = "Sidra's engine-independent logic: services, URLs, locales, themes and Last.fm rules"
edition.workspace = true
license.workspace = true

[dependencies]
icu_locale_core = { version = "2.4", features = ["alloc"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
